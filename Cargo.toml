[package]
name = "mpv_stt_plugin_rs"
version = "0.1.0"
edition = "2024"
description = "MPV real-time subtitle plugin (pure remote client: ASR + translation via subtitle-gateway)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Error handling
thiserror = "2.0.17"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

# Crypto (ferrum protocol AES-256-GCM / auth token)
aes-gcm = "0.10.3"
sha2 = "0.10.9"
rand = "0.9.2"

# Logging
log = "0.4.29"
env_logger = "0.11.8"

# Async runtime (translate.rs uses tokio::spawn + channels)
tokio = { version = "1.48.0", features = ["rt", "net", "time", "macros"] }
futures = "0.3.31"

# Audio processing
hound = "3.5.1"
tempfile = "3.24.0"

# SRT subtitle files
srtlib = "0.2.0"

# Config
figment = { version = "0.10.19", features = ["env", "toml"] }
directories = "6.0.0"

# Process
wait-timeout = "0.2.1"

# Concurrency
parking_lot = "0.12.5"

# mpv C API (bindgen-only crate)
mpv-client = "1.1.0"

libc = "0.2.178"
android_logger = "0.15.1"

# stt_ferrum feature: Opus compression + AES encryption support
hex = { version = "0.4", optional = true }
opusic-sys = { version = "0.5.8", optional = true }

# Non-optional: used by the DeepL/LibreTranslate-compatible remote translation
# backends (always compiled in) as well as the stt_ferrum / stt_openai backends.
reqwest = { version = "0.12.28", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
] }

[build-dependencies]
cc = "1.1.31"

# Desktop: link against a prebuilt FFmpeg (brew on macOS, BtbN on Linux/Windows).
# Without the `build` feature, ffmpeg-sys-next uses FFMPEG_DIR / pkg-config
# instead of compiling FFmpeg from source.
# Pinned to the fork's master, which handles FFmpeg 9's new side-data enum
# variants (AV_PKT_DATA_HEVC_CONF, AV_PKT_DATA_DYNAMIC_HDR_SMPTE_2094_APP5, the
# IAMF ones). Do NOT float this to the fork's default branch: the fork's
# origin/HEAD is stale (a v8-era commit whose match arms do not compile against
# ffmpeg-sys-next 9.x). And do NOT float to ffmpeg-next v9.0.0's own release —
# its match arms are incomplete for FFmpeg 9 as well.

[target.'cfg(not(target_os = "android"))'.dependencies]
ffmpeg-next = { git = "https://github.com/canxin121/rust-ffmpeg", rev = "3751e2800d5d2f0215d69031285aadebac5db8fc", features = [
    "software-resampling",
] }

# Android: dynamically link libffmpeg from the prebuilt prefix (FFMPEG_DIR).
[target.'cfg(target_os = "android")'.dependencies]
ffmpeg-next = { git = "https://github.com/canxin121/rust-ffmpeg", rev = "3751e2800d5d2f0215d69031285aadebac5db8fc" }

[features]
# Pure remote client: both backends are compiled in, the active one is picked
# at runtime via `config.stt.backend`.
default = ["stt_ferrum", "stt_openai"]
stt_ferrum = ["dep:hex", "dep:opusic-sys"]
stt_openai = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
